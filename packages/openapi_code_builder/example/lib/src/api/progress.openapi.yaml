tags:
  - name: Accounts overview
    description: >-
      ## What is a Xube Account?


      An Account is generally associated with an organization. Accounts are used
      to manage your organization's Xube devices, user permissions,
      configurations, and data management.


      ## What a Xube Account is not


      In Xube, the concepts of Users and Accounts are different. In Xube, the
      concepts of an Account and a User are different. A User is an individual
      who can access areas of Accounts where they have permission to do so.
      Accounts are organizations that users create and manage based on their
      permission levels for the Account. Users can belong to multiple Accounts,
      and any user can create an Account.
  - name: Account basics
    description: >-
      ## Account Creation and Identification


      Anyone can create a Xube account once they have signed up. Creating an
      account will automagically provide you with administrative privileges
      where you have full control to manage the account settings and
      permissions. Account must have at least one administrator at all times.


      ### Unique Account Names and IDs


      If your account name is already in use, Xube ensures uniqueness by adding
      a character (for example `your-account-name_<idx>`). This is known as your
      account id which is included in the response when creating an account via
      the Xube API. This is essential for all API interactions with Xube as it
      uniquely identifies your account for operations and support.


      ### Account Deletion Policy


      At the moment the ability to delete an account is not available, but it
      may be supported in the future if we get enough interest.
  - name: Account users
    description: >-
      ## Managing Account Users


      ### Adding and Removing Users


      To add a user to your account, an administrator or another user with the
      appropriate permissions needs to send an invite. Users can belong to
      multiple accounts if needed, which allows for flexible work across
      different teams, projects, or companies. Similarly, removing a user is
      straightforward and can be done by those with the right level of access.
      This helps keep your account secure and ensures only current team members
      have access.


      ### Role-Based Access Control (RBAC)


      In Xube, each user is assigned a specific role that defines what they can
      see and do within the account. At the moment there are several roles
      available:


      - **Administrators** have unrestricted access to all settings and data for
      the Account. They can add or remove users, adjust roles, configure
      settings, and access all data without restrictions. This role is typically
      reserved for team leaders or IT staff who need full oversight over the
      system's operation.

      - **Writers** are granted the ability to modify and update content within
      the system. They can add new entries, update existing data, and make
      changes as necessary, but they don't have access to manage user roles or
      change account-wide settings. This role is ideal for team members who need
      to contribute actively to projects but don't require control over system
      configurations.

      - **Readers** have view-only access, which allows them to see data and
      reports without the ability to make any changes. This role is suitable for
      stakeholders or team members who need to be informed about progress and
      metrics but do not participate in direct management of the content or
      settings.


      Each of these roles is designed to provide the necessary access based on
      the responsibilities of the user, ensuring that your system remains secure
      while promoting an efficient workflow.


      This system, known as Role-Based Access Control (RBAC), is designed to
      ensure that users have precisely the access they need—nothing less,
      nothing more. It's a great way to minimize risk and keep things running
      smoothly.
  - name: Account user permissions
    description: >-
      ### Configurable User Permissions


      Sometimes, predefined roles just don’t cut it when you need ultra-specific
      access controls. That's where Permissions come into play. In Xube,
      Permissions offer a fine-grained level of control, allowing you to tailor
      user capabilities directly to your needs.


      Administrators can manage the permissions of your users to ensure they
      align perfectly with your company’s policies. Whether it’s allowing a user
      to view specific datasets, modify device settings, or manage other users'
      access, Permissions can be adjusted to cover just about any action within
      the system.


      As an example, perhaps you would like to have a third party installer see
      details about the device health without being able to view other aspects
      of your Company's Xube configuration - just set the appropriate
      permissions and you're good to go.


      This flexibility not only enhances security by enforcing the principle of
      least privilege but also ensures that each team member has exactly the
      tools they need to be effective. You can view the Xube permissions
      references [here](https://xube.io)
  - name: User accounts
    description: |-
      ## Accessing Your Accounts

      Understanding and managing your account affiliations is straightforward in the Xube system. Here’s how you can view and manage the accounts you're associated with:

      ### Viewing Your Accounts

      You can view which accounts you have access to with the [Get User Accounts API](https://api.xube.io/docs#tag/User-accounts/operation/Get%20User%20Accounts). This view is private and only you can see the accounts that you have access to. It's a quick and easy way to keep track of your various roles and responsibilities across different projects or teams.

      ### Joining and Leaving Accounts

      **Leaving an Account:** If you decide that it's time to move on from a project or you no longer need access to an account, you can opt to leave the account. This action can be done through your account settings, ensuring that you maintain control over your participation in various accounts.

      **Joining an Account:** As for joining new accounts, there are two ways to go about it:

      - **Creating an Account:** If you’re starting a new project or initiative, you might want to create a new account. This gives you immediate administrator privileges, allowing you to set up the account exactly how you need.
      - **Receiving an Invitation:** Most users join additional accounts by invitation. Only existing members with the appropriate permissions can send invites, ensuring that new additions are authorized and intentional.

      Managing your account affiliations is designed to be as straightforward and secure as possible, giving you the flexibility to collaborate effectively while maintaining control over your access and involvement.
  - name: Account API keys
    description: >-
      ## API Keys


      API Keys provide a secure way to authenticate and interact with the Xube
      API programmatically. They are essential for integrating Xube services
      into your applications.


      ### Usage


      API Keys have the same permissions that the creator of the key has for an
      account.


      To use an API key, you need add the `x-xube-api-key` header to your
      request.


      ```bash

      curl -X GET "https://api.xube.com/v1/accounts/1234567890/api-keys" \

      -H "x-xube-api-key: your-api-key-here"

      ```
